; Rail22's Haraka: Haraka's defaults but the greeting (helo) and fewer MIME parts per message (mime_parts: 100, was Haraka's 1000)
[main]

[haproxy]
hosts[] =

[headers]
max_lines=1000
max_received=100

[max]
bytes=26214400
mime_parts=100
line_length=512
data_line_length=992

[message]
helo=Rail22 here.
close=closing connection. Have a jolly good day.

[uuid]
banner_chars=6
deny_chars=0
