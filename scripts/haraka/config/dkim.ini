; Rail22's Haraka: the mail sent through it (the app's, the forwarded aliases) is DKIM-signed with the key of its sender's domain,
; config/dkim/<domain>/ (private, selector: made by dkim/dkim_key_gen.sh); a domain without a key is sent unsigned. Incoming mail is verified (the plugin's default)
[sign]
enabled=true
headers=From, To, Sender, Subject, Date
