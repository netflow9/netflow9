; the NetFlow9 plugin (plugins/nfn.js), written by scripts/haraka.sh install (@...@ from app.env)
; the MongoDB user nfn_haraka (role nfnHaraka): its password is set by scripts/mongo.sh users (it rewrites uri)
[mongodb]
uri=mongodb://nfn_haraka:CHANGE_ME@127.0.0.1:27017/?authSource=@MONGO_DB@
db=@MONGO_DB@

; domain: NetFlow9's MAIL_INBOUND_DOMAIN; job_host / job_port: where the daemon takes NEWJOB (NetFlow9's DAEMON_HOST, default 127.0.0.1; DAEMON_PORT)
; forward_from: the envelope sender of forwarded aliases; bounce_dir: where bounces are saved (the app reads them)
[nfn]
domain=@DOMAIN@
job_host=127.0.0.1
job_port=@DAEMON_PORT@
forward_from=postmaster@@DOMAIN@
bounce_dir=@BASE@/bounces
