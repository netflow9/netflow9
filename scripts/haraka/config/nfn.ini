; CLD: 2026-10-24T10:55:00+03:00: the NetFlow9 plugin (plugins/nfn.js), written by scripts/haraka-install.sh (@...@ from app.env)
; the MongoDB user nfn_haraka (role nfnHaraka): its password is set by scripts/mongo-auth-setup.sh (it rewrites uri)
[mongodb]
uri=mongodb://nfn_haraka:CHANGE_ME@127.0.0.1:27017/?authSource=@MONGO_DB@
db=@MONGO_DB@

; domain: NetFlow9's MAIL_INBOUND_DOMAIN; job_socket: NetFlow9's config app.job_socket_path
[nfn]
domain=@DOMAIN@
job_socket=@BASE@/run/job-notify.sock
forward_from=postmaster@@DOMAIN@
bounce_dir=@BASE@/bounces
