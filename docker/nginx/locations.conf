# CLD: 2026-11-01T19:00:00+02:00: the app's site in Docker (from scripts/nginx.sh's template, the servers'): PHP on app:9000 (TCP; was the unix socket), the logs to the container's
# output (docker compose logs web), no /websocket (nothing serves it)

# static files compressed only (the PHP pages hold the CSRF token: BREACH)
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain text/xml application/xml font/ttf application/vnd.ms-fontobject;

client_max_body_size 100M;
client_body_buffer_size 2048k;
client_header_buffer_size 1024k;
large_client_header_buffers 32 64k;

fastcgi_buffer_size 1024k;
fastcgi_buffers 64 64k;
fastcgi_busy_buffers_size 2048k;
fastcgi_temp_file_write_size 2048k;
fastcgi_read_timeout 600;

root /srv/netflow9/public_html;
index index.php;

location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|eot|svg|ttf|txt|xml|html|map)$ {
    gzip on;
    expires max;
    add_header Pragma public;
    add_header Cache-Control must-revalidate;
    etag on;
}

location ~* /(.*\.pdf) {
    types { application/octet-stream .pdf; }
    default_type application/octet-stream;
}

location ~* /(.*\.mjs) {
    types { text/javascript .mjs; }
    default_type text/javascript;
    gzip on;
    expires max;
    add_header Pragma public;
    add_header Cache-Control must-revalidate;
    etag on;
}

location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
}

location ~ \.php(/|$) {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/netflow9/public_html$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT /srv/netflow9/public_html;
    fastcgi_param SERVER_NAME $host;
    fastcgi_pass app:9000;
    fastcgi_index index.php;
}

location / {
    try_files $uri @rewrite;
}
location @rewrite {
    rewrite ^/(.+)$ /index.php last;
}

add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "origin";
