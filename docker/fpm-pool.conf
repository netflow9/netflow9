; CLD: 2026-11-01T19:00:00+02:00: NetFlow9's PHP-FPM pool in Docker (scripts/system/fpm-pool.conf is the servers'): on TCP :9000 for the web container (nginx: fastcgi_pass app:9000),
; run by the image's user nfn (the master too: no user / group here)
[nfn]
listen = 9000
; only the containers' private network reaches it (compose.yaml: the port is not published)
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10

; the container's environment reaches PHP: NFN_CONFIG_DIR, NFN_RUNTIME, DAEMON_HOST, HARAKA_HOST, NFN_SETUP_* (compose.yaml)
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

slowlog = /srv/netflow9/logs/php-slow.log
php_admin_flag[log_errors] = on
php_value[session.save_handler] = files
php_value[session.save_path]    = /srv/netflow9/var/php/session
php_value[soap.wsdl_cache_dir]  = /srv/netflow9/var/php/wsdlcache
php_value[opcache.file_cache]   = /srv/netflow9/var/php/opcache
