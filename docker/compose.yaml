# Rail22 with Docker Compose (next to install.sh, the servers' way). From docker/: settings in .env (docker.sh setup, or copy env.example); then
#   docker compose build && docker compose up -d       and open the site (/setup, unless NFN_SETUP_JSON set it up)
# The site on HTTP_BIND:HTTP_PORT (127.0.0.1:8080): HTTPS by the operator's reverse proxy in front (README.md: nginx, Caddy); no mail server here:
# the operator's Haraka on the host (compose.mail.yaml publishes the database and the daemon for it; README.md: Inbound mail).
# Profile (COMPOSE_PROFILES in .env; on in env.example and docker.sh setup): browser (the AI steps' web browser).
# Upgrade: git pull && docker compose build && docker compose up -d (the app adds the new indexes at its start).
# Development (the working tree mounted, mailpit, a database of its own): docker compose -f compose.yaml -f compose.dev.yaml up -d
# The host's Haraka (inbound mail, the app's outgoing mail DKIM-signed): -f compose.mail.yaml

name: ${COMPOSE_PROJECT_NAME:-rail22}

# the images named after the project too: two installations on one host (each its own COMPOSE_PROJECT_NAME, NFN_UID) keep their own

x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-rail22}-app:local
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      NFN_UID: ${NFN_UID:-1000}
      NFN_GID: ${NFN_GID:-1000}
      TZ: ${TZ:-UTC}
  restart: unless-stopped
  environment: &app-env
    NFN_RUNTIME: docker
    NFN_CONFIG_DIR: /srv/rail22/config
    DAEMON_LISTEN: 0.0.0.0
    DAEMON_HOST: daemon
    DAEMON_PORT: ${DAEMON_PORT:-9000}
    # the host's Haraka (compose.mail.yaml: host.docker.internal): the Email (inbound) step and the Inbound mail tab
    HARAKA_HOST: ${HARAKA_HOST:-}
    # the setup's defaults (/setup): the database of the mongo container, its app user
    NFN_SETUP_MONGO_URI: mongodb://nfn_app:${NFN_APP_PW:?NFN_APP_PW is not set (.env)}@mongo:27017/?authSource=${MONGO_DB:-rail22-db}
    NFN_SETUP_MONGO_DB: ${MONGO_DB:-rail22-db}
    NFN_SETUP_SMTP_HOST: ${SMTP_HOST:-}
    NFN_SETUP_SMTP_PORT: ${SMTP_PORT:-}
    NFN_SETUP_BASE_URL: ${BASE_URL:-}
  # the data in folders of DATA_DIR (docker.sh setup: the user's home, docker-volumes/), not in docker's named volumes
  volumes: &app-volumes
    - ${DATA_DIR:?DATA_DIR is not set (.env)}/config:/srv/rail22/config
    - ${DATA_DIR:?DATA_DIR is not set (.env)}/logs:/srv/rail22/logs
    - ${DATA_DIR:?DATA_DIR is not set (.env)}/var:/srv/rail22/var
    - ${DATA_DIR:?DATA_DIR is not set (.env)}/tmp:/srv/rail22/tmp
    - ${DATA_DIR:?DATA_DIR is not set (.env)}/bounces:/srv/rail22/bounces
    - ${DATA_DIR:?DATA_DIR is not set (.env)}/assets:/srv/rail22/public_html/assets
  depends_on:
    mongo:
      condition: service_healthy

services:
  mongo:
    image: mongo:8.3
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PW:?MONGO_ROOT_PW is not set (.env)}
      # scripts/mongo_users.js, at the first start only (an empty database): nfn_admin, nfn_app, nfn_haraka and the role nfnHaraka
      NFN_DB: ${MONGO_DB:-rail22-db}
      NFN_ADMIN_PW: ${MONGO_ROOT_PW}
      NFN_APP_PW: ${NFN_APP_PW}
      NFN_HARAKA_PW: ${NFN_HARAKA_PW:?NFN_HARAKA_PW is not set (.env)}
    volumes:
      - ${DATA_DIR:?DATA_DIR is not set (.env)}/mongo-data:/data/db
      - ../scripts/mongo_users.js:/docker-entrypoint-initdb.d/10-nfn-users.js:ro
    networks: [ backend ]
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    <<: *app
    environment:
      <<: *app-env
      # the web browser's entry in mcp.json (browser profile)
      NFN_BROWSER_URL: ${NFN_BROWSER_URL:-}
      # optional: set up without the browser (sys::install's JSON, or a file's path in the container)
      NFN_SETUP_JSON: ${NFN_SETUP_JSON:-}
    command: [ "php-fpm" ]
    networks: [ backend, browser ]
    healthcheck:
      test: [ "CMD", "pgrep", "-f", "php-fpm: master" ]
      interval: 30s
      timeout: 5s
      retries: 3

  daemon:
    <<: *app
    command: [ "daemon" ]
    # as the server's unit (TimeoutStopSec): the workers finish their step
    stop_grace_period: 60s
    networks: [ backend, browser ]
    depends_on:
      mongo:
        condition: service_healthy
      app:
        condition: service_started

  web:
    image: ${COMPOSE_PROJECT_NAME:-rail22}-web:local
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    # the operator's reverse proxy forwards here (README.md); HTTP_BIND=0.0.0.0 only with a proxy elsewhere that alone reaches the port
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ${DATA_DIR:?DATA_DIR is not set (.env)}/assets:/srv/rail22/public_html/assets:ro
    networks: [ backend ]
    depends_on: [ app ]

  playwright:
    profiles: [ browser ]
    image: ${COMPOSE_PROJECT_NAME:-rail22}-playwright:local
    build:
      context: ..
      dockerfile: docker/playwright/Dockerfile
    restart: unless-stopped
    environment:
      PLAYWRIGHT_MCP_PORT: 8931
      PLAYWRIGHT_MCP_HOST: playwright
    # the firewall table only (its entrypoint drops every capability before the browser)
    cap_add: [ NET_ADMIN ]
    shm_size: 1gb
    networks: [ browser ]

networks:
  # the database, the app, the daemon, nginx
  backend:
  # the app and the daemon reach the browser; the browser's own firewall refuses every private address (the containers too)
  browser:

